<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ficha de Treino</title>
  <meta name="description" content="Abra e veja o treino de hoje.">

  <meta name="theme-color" content="#1d2a26">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ficha de Treino">
  <meta name="format-detection" content="telephone=no">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192-v2.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
  <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1320x2868.png">
  <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1206x2622.png">
  <link rel="apple-touch-startup-image" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1260x2736.png">
  <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1290x2796.png">
  <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1179x2556.png">
  <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1170x2532.png">
  <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1284x2778.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1125x2436.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1242x2688.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/splash-828x1792.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/splash-750x1334.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1242x2208.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>

  <div class="app">
    <header class="topbar">
      <p class="date" id="date"></p>
      <button class="pill-sm glass" id="btn-edit" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="m3 17.3V21h3.7L17.8 9.9l-3.7-3.7L3 17.3ZM20.7 7a1 1 0 0 0 0-1.4l-2.3-2.3a1 1 0 0 0-1.4 0l-1.8 1.8 3.7 3.7L20.7 7Z"/></svg>
        Editar
      </button>
      <button class="icon-btn glass" id="btn-theme" type="button" aria-label="Escolher cores">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 0 0 0 18c1.1 0 1.8-.9 1.8-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3Zm-5.5 9a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm3-4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm3 4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Z"/></svg>
      </button>
    </header>

    <main class="content" id="content" aria-live="polite"></main>
  </div>

  <div class="fade" aria-hidden="true"></div>
  <nav class="bottom" aria-label="Navegação">
    <button class="pill float" id="btn-today" type="button" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 5V2L7 6.5 12 11V8a5 5 0 1 1-5 5H5a7 7 0 1 0 7-8Z"/></svg>
      Voltar para hoje
    </button>
    <div class="dock float" id="dock" role="tablist" aria-label="Dias da semana"></div>
  </nav>

  <div class="toast float" id="toast" role="status" aria-live="polite" hidden></div>

  <div class="overlay" id="overlay" hidden>
    <div class="backdrop" data-close></div>

    <section class="sheet float" id="sheet-edit" role="dialog" aria-modal="true" aria-labelledby="edit-title" hidden>
      <div class="sheet-head">
        <div class="grabber" aria-hidden="true"></div>
        <h2 id="edit-title"></h2>
      </div>
      <form class="sheet-form" id="form-edit" autocomplete="off">
        <div class="sheet-body">
          <div class="field-row">
            <label class="field field-ficha">
              <span>Ficha</span>
              <input id="in-ficha" type="text" maxlength="4" placeholder="A" autocapitalize="characters" enterkeyhint="next" aria-label="Ficha (A, B, C...)">
            </label>
            <label class="field field-musculo">
              <span>Grupo muscular</span>
              <input id="in-muscle" type="text" maxlength="40" placeholder="Ex.: Peito e tríceps" enterkeyhint="next">
            </label>
          </div>
          <div class="field">
            <span>Exercícios</span>
            <ul class="rows" id="rows"></ul>
            <button class="add" id="btn-add" type="button">+ Adicionar exercício</button>
          </div>
        </div>
        <div class="sheet-actions">
          <button class="pill glass" type="button" data-close>Cancelar</button>
          <button class="pill primary" id="btn-save" type="submit">Salvar</button>
        </div>
      </form>
    </section>

    <section class="sheet float" id="sheet-theme" role="dialog" aria-modal="true" aria-labelledby="theme-title" hidden>
      <div class="sheet-head">
        <div class="grabber" aria-hidden="true"></div>
        <h2 id="theme-title">Cores do app</h2>
      </div>
      <div class="sheet-form">
        <div class="sheet-body"><div class="swatches" id="swatches"></div></div>
        <div class="sheet-actions">
          <button class="pill primary" type="button" data-close>Pronto</button>
        </div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
